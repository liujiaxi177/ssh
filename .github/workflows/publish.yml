# Publishes the `ssh-mcp-win` distribution to PyPI via Trusted Publishing (OIDC),
# so no API token lives in this repository.
#
# One-time setup before the first release:
#   1. PyPI -> Your projects -> Publishing -> "Add a pending publisher"
#      Project name: ssh-mcp-win
#      Owner:        liujiaxi177
#      Repository:   ssh
#      Workflow:     publish.yml
#      Environment:  (leave empty)
#   2. Publish a GitHub release with tag v<version>, matching
#      src/ssh_mcp/__init__.py.  A version cannot be re-uploaded to PyPI, so bump
#      it before tagging.
name: Publish package

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Build distribution artifacts
        run: |
          python -m pip install --upgrade pip
          python -m pip install build
          python -m build

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
